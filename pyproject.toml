[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-lang"
version = "0.1.0"
description = "A tiny beginner-friendly coding language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
easy = "easy_lang.cli:main"
