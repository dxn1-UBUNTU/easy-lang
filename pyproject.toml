[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrix-lang"
version = "0.1.0"
description = "A programmable language for terminal workspaces, APIs, and interactive tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "prompt_toolkit>=3.0",
    "pygments>=2.0",
]

[project.scripts]
metrix = "metrix_lang.cli:main"
m = "metrix_lang.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["metrix_lang*"]
exclude = ["install*", "tests*"]
